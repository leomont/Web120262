<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Juego de caracteres unicode para admitir tildes, eñes y caracteres internacionales -->
  <meta charset="UTF-8">
  
  <!-- Configura el viewport para que la escala y ancho se adapten al dispositivo móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Fundamentos de HTML5 y CSS3 | Sesión 1</title>
  
  <!-- Vinculación de la hoja de estilos externa -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado principal: Único por documento por jerarquía y accesibilidad -->
  <h1>Introducción al Desarrollo Web Moderno</h1>
  
  <!-- Párrafo estructurado con contenido descriptivo -->
  <p>
    HTML estructura el contenido de la web mediante elementos semánticos, 
    mientras que CSS toma esos elementos para definir su presentación, geometría y estilo visual.
  </p>

</body>
</html>
